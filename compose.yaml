
services:
  mongodb:
    image: mongo:7
    container_name: devopsflow-mongodb
    restart: unless-stopped

    ports:
      - "127.0.0.1:27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: devopsflow_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the root .env file}

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 }).ok" | grep 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: devopsflow-backend
    restart: unless-stopped

    ports:
      - "127.0.0.1:5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      MONGODB_URI: "mongodb://devopsflow_admin:${MONGO_ROOT_PASSWORD}@mongodb:27017/devopsflow?authSource=admin"

    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: devopsflow-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      - backend

volumes:
  mongodb_data:
